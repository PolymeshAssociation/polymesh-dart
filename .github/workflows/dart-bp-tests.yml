name: Dart-BP Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'dart-bp/**'
      - 'dart-common/**'  # Include dart-common since dart-bp might depend on it
      - 'Cargo.toml'      # Root workspace file
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test dart-bp crate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Check formatting
        run: cargo fmt --package polymesh-dart-bp -- --check

      - name: Run tests
        run: cargo nextest run --release --package polymesh-dart-bp

      - name: Check formatting for polymesh-dart crate
        run: cargo fmt --package polymesh-dart -- --check

      - name: Run tests for polymesh-dart crate
        run: cargo nextest run --release --package polymesh-dart

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Run negative tests by disabling prover's input sanitation and mocking features
        run: cargo +nightly nextest run --package polymesh-dart-bp --features ignore_prover_input_sanitation,nightly_mocking_tests input_sanitation_disabled mocking_tests

  test-wasm:
    name: Build dart-bp for WASM target
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build for WASM
        run: cargo build --package polymesh-dart-bp --target wasm32-unknown-unknown --no-default-features --features host_proofs

  # The sigma-only auth proofs (host_proofs off). No Bulletproofs/curve-tree stack, so they build for the embedded Ledger target.
  embedded-thumbv7em:
    name: Build auth proofs for thumbv7em-none-eabi (Ledger)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-thumbv7em-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build auth proofs for thumbv7em-none-eabi
        run: cargo build --package polymesh-dart-bp --no-default-features --target thumbv7em-none-eabi

  tee-musl:
    name: Build auth proofs for ${{ matrix.target }} (TEE)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build auth proofs for ${{ matrix.target }}
        run: cargo build --package polymesh-dart-bp --no-default-features --features std,asm,parallel --target ${{ matrix.target }}
